name: Test

on:
  push:
    branches: [master]
    paths:
      - 'scripts/**'
      - 'test/**'
      - 'build-config.json'
      - 'compose.yml'
      - 'Taskfile.dist.yml'
      - '.hadolint.yml'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'test/**'
      - 'build-config.json'
      - 'compose.yml'
      - 'Taskfile.dist.yml'
      - '.hadolint.yml'
      - '.github/workflows/test.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # An exact version, so setup-task needs no GitHub API call to resolve it.
  # Latest version: https://github.com/go-task/task/releases
  TASK_VERSION: 3.54.0

jobs:
  checkall:
    name: Checkall
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Run every check
        run: task checkall

      - name: Check the working tree is unchanged
        run: git diff --exit-code && test -z "$(git status --porcelain)"
